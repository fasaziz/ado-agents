---
name: $(Build.DefinitionName).1.0$(Rev:.r)
pool: Kubernetes Agents - Dev

trigger: none

resources:
  containers:
    - container: node
      image: capitalontap.azurecr.io/node/node:18.6.0
      endpoint: ACR CapitalOnTap
      #volumes: 

    - container: gitversion
      image: capitalontap.azurecr.io/library/gittools/gitversion:6.0.0-alpine.3.16-6.0
      endpoint: ACR CapitalOnTap

stages:
- stage: Yarn
  displayName: Yarn Install and Run Unit Tests
  jobs:
  - job: Yarn_Install_and_Run_Unit_Tests
    steps:
    - task: CmdLine@2
      displayName: Yarn install
      target: node
      inputs:
        script: yarn install --network-timeout 1000000
    - task: CmdLine@2
      displayName: Yarn - Clear jest cache
      target: node
      inputs:
        script: yarn test --clearCache
        workingDirectory: $(System.DefaultWorkingDirectory)/apps/portal
    - task: CmdLine@2
      displayName: Yarn - Run unit tests
      target: node
      inputs:
        script: yarn test
        workingDirectory: $(System.DefaultWorkingDirectory)/apps/portal
